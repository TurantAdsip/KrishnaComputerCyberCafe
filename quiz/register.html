<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | KrishnaPrep</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                <h1>KrishnaPrep</h1>
                <p>Learn Today, Lead Tomorrow</p>
            </div>

            <div class="auth-heading">
                <h2>Create Student Account</h2>
                <p>Register to access quizzes and exam results.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName" placeholder="Enter your full name" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="studentEmail">Email Address</label>
                    <input type="email" id="studentEmail" placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="studentGender">Gender</label>
                    <select id="studentGender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input type="password" id="password" placeholder="Minimum 8 characters"
                            autocomplete="new-password" minlength="8" required>

                        <button type="button" class="toggle-password" data-target="password">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-box">
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password"
                            autocomplete="new-password" required>

                        <button type="button" class="toggle-password" data-target="confirmPassword">
                            Show
                        </button>
                    </div>
                </div>

                <div id="message" class="message" role="status"></div>

                <button type="submit" id="registerBtn" class="submit-btn">
                    Create Account
                </button>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

            <div class="back-home">
                <a href="../index.html">← Back to KrishnaPrep</a>
            </div>

        </section>

    </main>

    <!-- <script src="register.js"></script> -->
    <script type="module" src="register.js"></script>

</body>

</html>
