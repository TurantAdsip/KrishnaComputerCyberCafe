<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta name="description" content="Latest Government Exams, Results, Admit Card, Current Affairs and Jobs">
    <meta name="keywords" content="Government Jobs, SSC, UPSC, Railway, Result, Admit Card">
    <meta name="author" content="Exam Portal">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="icon" type="image/png" href="../Assets/Logo.png">
    <link rel="icon" type="image/png" href="../Assets/Logo1.png">
    <title>Student Login | KrishnaPrep</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                <h1>KrishnaPrep</h1>
                <p>Learn Today, Lead Tomorrow</p>
            </div>

            <div class="auth-heading">
                <h2>Student Login</h2>
                <p>Login to access your student dashboard.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="studentEmail">Email Address</label>

                    <input type="email" id="studentEmail" placeholder="Enter your registered email" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input type="password" id="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" class="toggle-password" data-target="password">
                            Show
                        </button>

                    </div>
                </div>

                <div id="message" class="message" role="status"></div>

                <button type="submit" id="loginBtn" class="submit-btn">
                    Login
                </button>

            </form>

            <div class="auth-footer">
                Don't have an account?
                <a href="register.html">Register Now</a>
            </div>

            <div class="back-home">
                <a href="../index.html">← Back to KrishnaPrep</a>
            </div>

        </section>

    </main>

    <!-- <script src="login.js"></script> -->
    <script type="module" src="login.js"></script>

</body>

</html>
