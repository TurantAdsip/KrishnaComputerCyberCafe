<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | KrishnaPrep</title>

    <link rel="stylesheet" href="admin-login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="description" content="Latest Government Exams, Results, Admit Card, Current Affairs and Jobs">
    <meta name="keywords" content="Government Jobs, SSC, UPSC, Railway, Result, Admit Card">
    <meta name="author" content="Exam Portal">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="icon" type="image/png" href="../Assets/Logo.png">
    <link rel="icon" type="image/png" href="../Assets/Logo1.png">

</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="admin-icon">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                KrishnaPrep Administration Panel
            </p>

            <form id="adminLoginForm">

                <div class="input-group">
                    <label for="adminEmail">Email Address</label>

                    <input type="email" id="adminEmail" placeholder="Enter admin email" required>
                </div>

                <div class="input-group">
                    <label for="adminPassword">Password</label>

                    <input type="password" id="adminPassword" placeholder="Enter password" required>
                </div>

                <button type="submit" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login to Dashboard
                </button>

                <p id="loginMessage"></p>

            </form>

            <a href="../index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Website
            </a>

        </div>

    </main>

    <script type="module" src="admin-login.js"></script>

</body>

</html>
